name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL || 'https://raw.githubusercontent.com/h0623-dev/House/gh-pages/update.json' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: |
          npm ci
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Check game logic
        run: npm test
      - name: Set increasing Android version code
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_ENV"
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release-version.json', 'utf8'));
          const code = Math.max(release.versionCode, Number(process.env.GITHUB_RUN_NUMBER) + 1);
          if (!Number.isSafeInteger(code) || code < 1 || code > 2100000000) throw new Error('Invalid Android version code');
          console.log(`APP_VERSION_CODE=${code}`);
          JS
      - name: Build test APK
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: bash scripts/build-android.sh debug
      - name: Restore release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release.keystore'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_PUBLIC_URL: ${{ vars.APK_PUBLIC_URL }}
        run: bash scripts/build-android.sh release
      - name: Save APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: road-haven-android-${{ github.run_number }}
          path: artifacts/*
          retention-days: 90
      - name: Remove temporary release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
