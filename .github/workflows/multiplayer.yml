name: 온라인 만남 서버 배포

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-haven-meeting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meeting-release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy compiled server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '13c8f055e89f5591817f759782be8683' }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f index.js
          test -f wrangler.json
          npx --yes wrangler@4.151.1 deploy --config wrangler.json --no-bundle
