name: Publish standalone native APK download

on:
  push:
    branches: [native-rebuild-downloads]

permissions:
  contents: write

concurrency:
  group: road-haven-native-rebuild-download-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'h0623-dev/House' && github.ref == 'refs/heads/native-rebuild-downloads' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the published download commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-28
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use the verified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-28
        with:
          node-version: '22'
      - name: Validate exact manifest and reconstruct the signed APK
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { closeSync, lstatSync, mkdirSync, openSync, readFileSync, readSync, writeFileSync, writeSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const expected = {"schemaVersion":1,"fileName":"road-haven-native-0.88.0-rebuild.5.apk","bytes":206407445,"sha256":"7e552baeeb08c024f51e7d7ef004ed8263644925f0158fc6d9df7623912c4e65","applicationId":"com.roadhaven.rebuild","versionName":"0.88.0-rebuild.5","versionCode":5,"apkCertificateSha256":"6260bb22d083829c87ef9558b2474becc2873ca0e9de640e8545562ce6e85ea3","releaseTag":"native-rebuild-v0.88.0-rebuild.5","parts":[{"path":"apk-parts/road-haven-native-0.88.0-rebuild.5.apk.part-00","bytes":83886080,"sha256":"6f64ea49f857277031a5ff6bb9bed1fa47a4c7f1688752ffae6446e90f0c501b"},{"path":"apk-parts/road-haven-native-0.88.0-rebuild.5.apk.part-01","bytes":83886080,"sha256":"b9754e2d6209c9ebef0329d055b007009fc634155607328181554633c8f3755e"},{"path":"apk-parts/road-haven-native-0.88.0-rebuild.5.apk.part-02","bytes":38635285,"sha256":"674b8a2da97134d20b4a57c3c1ffe428f8244e1a274a83e46df3f67313a4d6c8"}]};
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/);
          const head = git('rev-parse', 'HEAD');
          assert.equal(head, process.env.GITHUB_SHA);
          assert.equal(git('status', '--porcelain', '--untracked-files=all'), '', 'Download checkout must remain clean.');
          const latest = git('ls-remote', '--exit-code', 'origin', 'refs/heads/native-rebuild-downloads').split(/\s+/)[0];
          assert.equal(latest, head, 'A newer download commit exists; do not publish an outdated queued run.');
          const paths = ['.github/workflows/native-rebuild-download.yml', 'apk-manifest.json', ...expected.parts.map(part => part.path)].sort();
          const entries = git('ls-tree', '-r', '-z', 'HEAD').split('\0').filter(Boolean).map(row => {
            const separator = row.indexOf('\t');
            const [mode, kind] = row.slice(0, separator).split(' ');
            assert.equal(mode, '100644'); assert.equal(kind, 'blob');
            return row.slice(separator + 1);
          });
          assert.deepEqual(entries.sort(), paths, 'Only the reviewed binary parts, manifest and fixed workflow may be public.');
          for (const path of paths) {
            const stat = lstatSync(path);
            assert.ok(stat.isFile() && !stat.isSymbolicLink());
          }
          const manifestRaw = readFileSync('apk-manifest.json', 'utf8');
          assert.equal(manifestRaw, JSON.stringify(expected, null, 2) + '\n', 'Manifest must match the exact reviewed bytes.');
          assert.deepEqual(JSON.parse(manifestRaw), expected);
          assert.equal(expected.parts.length, 3);
          assert.equal(expected.parts.reduce((total, part) => total + part.bytes, 0), expected.bytes);
          assert.ok(process.env.RUNNER_TEMP && resolve(process.env.RUNNER_TEMP) !== process.cwd());
          const directory = join(process.env.RUNNER_TEMP, 'native-rebuild-download');
          mkdirSync(directory);
          const output = join(directory, expected.fileName), destination = openSync(output, 'wx', 0o644);
          const whole = createHash('sha256'), buffer = Buffer.alloc(1024 * 1024);
          let total = 0;
          try {
            for (const part of expected.parts) {
              const stat = lstatSync(part.path);
              assert.equal(stat.size, part.bytes); assert.ok(stat.size > 0 && stat.size <= 80 * 1024 * 1024);
              const hash = createHash('sha256'), source = openSync(part.path, 'r');
              let count = 0;
              try {
                for (;;) {
                  const bytes = readSync(source, buffer, 0, buffer.length, null);
                  if (!bytes) break;
                  const data = buffer.subarray(0, bytes);
                  hash.update(data); whole.update(data);
                  let written = 0;
                  while (written < bytes) {
                    const amount = writeSync(destination, data, written, bytes - written);
                    assert.ok(amount > 0); written += amount;
                  }
                  count += bytes;
                }
              } finally { closeSync(source); }
              assert.equal(count, part.bytes); assert.equal(hash.digest('hex'), part.sha256);
              total += count;
            }
          } finally { closeSync(destination); }
          assert.equal(total, 206407445);
          assert.equal(lstatSync(output).size, total);
          assert.equal(whole.digest('hex'), '7e552baeeb08c024f51e7d7ef004ed8263644925f0158fc6d9df7623912c4e65');
          writeFileSync(join(directory, 'SHA256SUMS'), `${expected.sha256}  ${expected.fileName}\n`, { flag: 'wx' });
          writeFileSync(join(directory, 'release-notes.md'), [
            '로드헤이븐 · 0.88.0-rebuild.5', '',
            '게임 안에서 새 게임 기능·맵·이미지를 자동으로 받아 다음 실행 때 적용하는 Android 네이티브 APK입니다. 설정의 게임 업데이트에서 저장 후 지금 적용할 수도 있으며, 새 파일 검증이나 첫 실행에 실패하면 이전 정상 버전으로 복구합니다. 약 197 MiB입니다.', '',
            'rebuild.1~4 APK를 설치했다면 앱을 삭제하지 않고 이번 APK를 한 번 업데이트 설치하세요. 같은 앱 ID·서명·저장 위치를 유지하며, 이후 일반 게임 업데이트는 앱 안에서 처리합니다. Android 호스트·엔진 변경에는 별도 APK 설치가 필요할 수 있습니다.', '',
            '최종 컴파일 게임의 Linux 터치 이벤트·화면 검사와 APK 패키지·서명 검증을 완료했습니다. 실제 Android 휴대폰 업데이트 설치 및 성능 검증은 아직 하지 않아 사전 공개로 제공합니다.', '',
            '기존 앱의 다운로드와 자동 업데이트 경로는 변경하지 않았습니다.', ''
          ].join('\n'), { flag: 'wx' });
          console.log(JSON.stringify({ commit: head, applicationId: expected.applicationId, bytes: total, sha256: expected.sha256 }));
          NODE
      - name: Publish a separate prerelease without changing existing downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_REPO: h0623-dev/House
        run: |
          set -euo pipefail
          readonly tag='native-rebuild-v0.88.0-rebuild.5'
          readonly file='road-haven-native-0.88.0-rebuild.5.apk'
          readonly directory="$RUNNER_TEMP/native-rebuild-download"
          test "$(git ls-remote origin "refs/tags/$tag")" = ''
          test "$(git ls-remote origin refs/heads/native-rebuild-downloads | cut -f1)" = "$GITHUB_SHA"
          cd "$directory"
          sha256sum --check SHA256SUMS
          # Existing tags or releases are conflicts: never delete, overwrite or upload --clobber.
          gh release create "$tag" "$file" SHA256SUMS --draft --prerelease --latest=false --target "$GITHUB_SHA" --title '로드헤이븐 0.88.0-rebuild.5' --notes-file release-notes.md
          gh release view "$tag" --json assets,isDraft,isPrerelease,targetCommitish,tagName > release-check.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, statSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release-check.json', 'utf8'));
          assert.equal(release.tagName, 'native-rebuild-v0.88.0-rebuild.5');
          assert.equal(release.targetCommitish, process.env.GITHUB_SHA);
          assert.equal(release.isDraft, true); assert.equal(release.isPrerelease, true);
          assert.deepEqual(release.assets.map(asset => asset.name).sort(), ['SHA256SUMS', 'road-haven-native-0.88.0-rebuild.5.apk']);
          for (const asset of release.assets) {
            assert.equal(asset.size, statSync(asset.name).size);
            assert.equal(asset.state, 'uploaded');
          }
          NODE
          gh release edit "$tag" --draft=false --prerelease --latest=false
          printf '%s\n' 'APK: https://github.com/h0623-dev/House/releases/download/native-rebuild-v0.88.0-rebuild.5/road-haven-native-0.88.0-rebuild.5.apk' >> "$GITHUB_STEP_SUMMARY"
