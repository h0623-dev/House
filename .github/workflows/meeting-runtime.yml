name: Publish reviewed meeting runtime

on:
  push:
    branches: [meeting-release]
    paths:
      - index.js
      - wrangler.json

permissions:
  contents: read

concurrency:
  group: road-haven-meeting-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'h0623-dev/House' && github.ref == 'refs/heads/meeting-release' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-28
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the existing Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-28
        with:
          node-version: '22'
      - name: Check the public runtime and Worker identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, lstatSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const expectedPaths = ['.github/workflows/meeting-runtime.yml', 'index.js', 'wrangler.json'];
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/);
          assert.equal(head, process.env.GITHUB_SHA);
          assert.equal(execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], { encoding: 'utf8' }).trim(), '', 'Deployment checkout must remain clean.');
          const latest = execFileSync('git', ['ls-remote', '--exit-code', 'origin', 'refs/heads/meeting-release'], { encoding: 'utf8' }).trim().split(/\s+/)[0];
          assert.equal(latest, head, 'A newer meeting runtime is published; do not deploy this queued commit.');
          const paths = execFileSync('git', ['ls-tree', '-r', '--name-only', 'HEAD'], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(paths, expectedPaths);
          for (const file of expectedPaths) {
            const stat = lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink());
          }
          const config = JSON.parse(readFileSync('wrangler.json', 'utf8'));
          assert.deepEqual(config, {
            name: 'road-haven-meeting', main: 'index.js', compatibility_date: '2026-10-18', workers_dev: true,
            durable_objects: { bindings: [{ name: 'MEETING_ROOMS', class_name: 'MeetingRoom' }] },
            migrations: [{ tag: 'v1', new_sqlite_classes: ['MeetingRoom'] }]
          });
          const bundle = readFileSync('index.js');
          assert.ok(bundle.length > 0 && bundle.length < 4 * 1024 * 1024);
          assert.ok(!/sourceMappingURL=/.test(bundle.toString('utf8')));
          console.log(JSON.stringify({ commit: head, worker: config.name, bundleBytes: bundle.length, bundleSha256: createHash('sha256').update(bundle).digest('hex') }));
          NODE
      - name: Deploy the checked compiled runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '13c8f055e89f5591817f759782be8683' }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.151.1 deploy --config wrangler.json --no-bundle
