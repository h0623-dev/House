html,body{margin:0;min-height:100%;background:#edf2df;color:#254d3b;font-family:system-ui,sans-serif}

#road-haven-bootstrap .bootstrap-emblem{position:relative;width:128px;height:128px;margin:16px auto 0}
#road-haven-bootstrap .bootstrap-emblem:before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,#f8e9b7 0,#edf2d7 56%,transparent 72%)}
#road-haven-bootstrap .bootstrap-emblem:after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:11px;border-radius:50%;background:#8ca77925;animation:road-haven-bootstrap-shadow 4s ease-in-out infinite}
#road-haven-bootstrap img{position:relative;z-index:1;display:block;width:116px;height:116px;margin:0 auto;border-radius:29px;box-shadow:0 8px 20px #536b3920;animation:road-haven-bootstrap-drift 4s ease-in-out infinite}
#road-haven-bootstrap .bootstrap-leaf{position:absolute;z-index:2;width:16px;height:9px;border-radius:100% 0 100% 0;background:#86a865;animation:road-haven-bootstrap-leaf 4s ease-in-out infinite}
#road-haven-bootstrap .bootstrap-leaf:first-of-type{left:-4px;top:38px;rotate:-28deg}
#road-haven-bootstrap .bootstrap-leaf:last-of-type{right:-2px;top:12px;width:12px;height:7px;background:#c8ad65;rotate:18deg;animation-delay:-1.5s}

#road-haven-bootstrap p{min-height:3em;margin:10px 0 18px;color:#6a7b58;font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}

#road-haven-bootstrap progress::-moz-progress-bar{border-radius:8px;background:#80a665}
#road-haven-bootstrap button{margin-top:18px;padding:12px 24px;border:0;border-radius:14px;background:#315f46;color:#fffdf0;font:600 14px system-ui,sans-serif;cursor:pointer}
